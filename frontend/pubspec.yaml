name: kura_ai
description: "Kura AI - Asisten makanan cerdas berbasis AI untuk Indonesia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  camera: ^0.12.1
  permission_handler: ^11.3.1
  image_picker: ^1.2.4
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo_kura.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00B4A0"
  adaptive_icon_foreground: "assets/images/logo_kura.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
