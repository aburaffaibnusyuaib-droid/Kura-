name: kura_ai
description: "Kura AI - Asisten makanan cerdas berbasis AI untuk Indonesia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  camera: ^0.12.1
  permission_handler: ^11.3.1
  image_picker: ^1.2.4
  flutter_dotenv: ^6.0.1
  http: ^1.6.0

dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
